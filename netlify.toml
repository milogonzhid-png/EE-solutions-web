[[redirects]]
  from = "https://jocular-yeot-b76b98.netlify.app/*"
  to = "https://eesolutions.com.mx/:splat"
  status = 301
  force = true

# "/app" a secas NO lo cubre la regla "/app/*" de abajo: Netlify le agrega la
# diagonal final y Next.js (trailingSlash: false) se la quita, y se ciclan
# infinitamente -> ERR_TOO_MANY_REDIRECTS. Se proxea explicitamente. Tiene que
# ir ANTES de la regla con splat.
[[redirects]]
  from = "/app"
  to = "https://ee-solutions-web.milo-gonzhid.workers.dev/app"
  status = 200
  force = true

# Dashboard (Next.js, worker de Cloudflare). Respaldo: hoy quien atiende
# /app/* es una ruta de Cloudflare, que intercepta antes de llegar aqui. Estas
# reglas quedan por si el dominio volviera a resolver por Netlify.
[[redirects]]
  from = "/app/*"
  to = "https://ee-solutions-web.milo-gonzhid.workers.dev/app/:splat"
  status = 200
  force = true
