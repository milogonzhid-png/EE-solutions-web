[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# La app vive bajo /app (basePath), asi que la raiz de este sitio de Netlify
# no tiene nada y responde 404 — eso es lo que se ve en la vista previa del
# panel de Netlify y al dar "abrir sitio", aunque la app este bien. Se manda
# al login para que no parezca rota.
[[redirects]]
  from = "/"
  to = "/app/login"
  status = 302
  force = true
